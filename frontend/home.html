<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
    <style>
        * {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-transform: capitalize;
        }

        header {
            height: 5rem;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 30px;
            box-shadow: 0 0 3px grey;
        }

        a {
            text-decoration: none;
            color: red;
            font-size: 1.3em;
        }

        a:hover {
            color: black;
            text-decoration-line: underline;
        }

        #dashboard {
            width: 100%;
            height: auto;
            display: flex;
            justify-content: center;
            flex-direction: column;

        }

        #box1 {
            height: 15rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        #box1 div {
            padding: 5rem 1.5rem;
            box-shadow: 0 0 1px rgb(58, 1, 1);
            border-radius: 20px;
            background-color: rgb(255, 254, 254);
            color: rgb(0, 0, 0);
            font-size: 20px;
            border: 3px solid red;

        }

        #box2 ul li {
            height: max-content;
            line-height: 3rem;
            box-shadow: 0 0 px rgb(58, 1, 1);
            width: 70rem;
            list-style-type: none;
            text-align: center;
            background-color: rgb(255, 255, 255);
            border-radius: 10px ;
            color: rgb(0, 0, 0);
            border: 3px solid red;
            margin-top: 5px;

        }

        h1 {
            text-align: center;
        }

        #yourprofile button {
            display: block;
            margin: 0 auto;
            padding: 1rem 1rem;
            text-transform: capitalize;
            background-color: red;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        #yourprofile button:hover {
            background-color: black;
            color: red;
        }

        #yourprofile {
            position: relative;
        }


        #profile-box {
            display: none;
            position: absolute;
            top: 3rem;
            right: -4rem;
            width: 250px;
            padding: 1rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0px 0px 5px grey;
            text-align: center;
        }


        #yourprofile:hover #profile-box {
            display: block;
        }


        #profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <header>
        <h3>finTrack</h3>
        <a href="./home.html">home</a>
        <a target="_blank" href="./transaction.html">transaction</a>
        <a target="_blank" href="./budget.html">budget</a>
        <div id="yourprofile">
            <button>your profile</button>
            <div id="profile-box">
                <img id="profile-img" src="" alt="profile">
                <h3 id="profile-name"></h3>
                <p id="profile-email"></p>
                <button onclick="window.location.href='./edit.html'" style=" background-color: red;
            border-radius: 20px;
            border: none;
            padding: .5rem 3rem;
            color: white;">edit profile</button><br>
                <button id="logout" style=" background-color: red;
            border-radius: 20px;
            border: none;
            padding: .5rem 3rem;
            color: white;">logout</button>
            </div>
        </div>
    </header>
    <div id="dashboard">
        <div id="box1">
            <div id="income"></div>
            <div id="expense"></div>
            <div id="budget"></div>
        </div>
        <div id="box2">
            <h1> recent transaction</h1>
            <ul id="transaction-list">
                
            </ul>
        </div>
    </div>

</body>
<script src="./profiledisplay.js"></script>
<script src="./logout.js"></script>
<script src="./dashboard.js"></script>

</html>
