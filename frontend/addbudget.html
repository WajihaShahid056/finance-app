<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>budget</title>
    <style>
        *{
            text-transform: capitalize;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
        }
        form{
             display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; 
            row-gap: 10px;
        }
        label{
            font-size: 1.5em;
        }
        input{
            font-size: 1.2em;
        }
        h1{
            color: red;
        }
        #save{
             background-color: red;
            border-radius: 20px;
            border: none;
            padding: .5rem 3rem;
            color: white;
        }
        #save:hover{
            background-color: black;
        }
    </style>
</head>
<body>
   <h1>set your monthly budget</h1> 
   <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate earum nulla doloremque ut reprehenderit dolores a recusandae voluptates quo tempore!</p>
   <form id="budget-form">
    <label for="month">month</label>
    <input type="month" id="month">
    <label for="budget">budget</label>
    <input type="number" id="budget">
    <label for="save">save your budget</label>
    <input type="submit" id="save">
</form>
<script src="./addbudget.js"></script>
</body>
</html>
