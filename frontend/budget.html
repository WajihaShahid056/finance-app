<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>budget</title>
    <style>
        *{
            text-transform: capitalize;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        button{
              background-color: red;
            border-radius: 20px;
            border: none;
            padding: .5rem 3rem;
            color: white;
        }
        button:hover{
            background-color: black;
        }
       #budget-container {
    width: 80%;
    margin: 2rem auto;
}

.budget-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem;
    margin-bottom: 1rem;
    border-radius: 15px;
    box-shadow: 0 0 4px grey;
    background-color: white;
}

.budget-details h3 {
    margin: 0;
    color: grey;
   
}

.budget-details p {
    margin: 8px 0;
    color: grey;

}

.budget-details span {
    color: grey;
}

.budget-type {
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: grey;

}

.budget-actions {
    display: flex;
    gap: 10px;
}

.budget-actions button {
    padding: 8px 18px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

.delete-btn {
    background-color: red;
    color: white;
}

.delete-btn:hover {
    background-color: black;
    color: white;
}
    </style>
</head>
<body>
    <h1>set your monthly budget </h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Illum neque aspernatur totam cumque beatae nesciunt, tempore quis facere veritatis vel.</p>
    <button onclick="window.location.href='./addbudget.html'">add budget</button>
    <h1>your budget</h1>
    <div id="budget-container">

    <div class="budget-card">
   
            <h3 class="budget"></h3>
            <span class="month"></span>
      
       
        <div class="budget-actions">
            <button class="delete-btn">delete</button>
        </div>
    </div>

</div>
</body>
<script src="./budgetdisplay.js"></script>
</html>
