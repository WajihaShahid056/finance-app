<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transaction</title>
    <style>
        *{
            text-transform: capitalize;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        button{
              background-color: red;
            border-radius: 20px;
            border: none;
            padding: .5rem 3rem;
            color: white;
        }
        button:hover{
            background-color: black;
        }
       #transaction-container {
    width: 80%;
    margin: 2rem auto;
}

.transaction-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem;
    margin-bottom: 1rem;
    border-radius: 15px;
    box-shadow: 0 0 4px grey;
    background-color: white;
}

.transaction-details h3 {
    margin: 0;
    color: grey;
   
}

.transaction-details p {
    margin: 8px 0;
    color: grey;

}

.transaction-details span {
    color: grey;
}

.transaction-type {
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: grey;

}

.transaction-actions {
    display: flex;
    gap: 10px;
}

.transaction-actions button {
    padding: 8px 18px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

.edit-btn {
    background-color: red;
}

.delete-btn {
    background-color: red;
    color: white;
}

.edit-btn:hover,
.delete-btn:hover {
    background-color: black;
    color: white;
}
    </style>
</head>
<body>
    <h1>track your transactions</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Illum neque aspernatur totam cumque beatae nesciunt, tempore quis facere veritatis vel.</p>
    <button onclick="window.location.href='./addtransaction.html'">add transaction</button>
    <h1>your transactions</h1>
    <div id="transaction-container">

    <div class="transaction-card">
        <div class="transaction-details">
            <h3 class="category"></h3>
            <p class="description"></p>
            <span class="date"></span>
        </div>
        <div class="transaction-type">
            <span class="type"></span>
            <strong class="amount"></strong>
        </div>
        <div class="transaction-actions">
            <button onclick="window.location.href='./edittransaction.html'" class="edit-btn">edit</button>
            <button class="delete-btn">delete</button>
        </div>
    </div>

</div>
</body>
<script src="./transactiondisplay.js"></script>
</html>
